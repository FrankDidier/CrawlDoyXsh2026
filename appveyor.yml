# AppVeyor CI configuration for building Windows executable
# Free for open source projects: https://www.appveyor.com/

image: Visual Studio 2022

environment:
  matrix:
    - PYTHON: "C:\\Python311-x64"
      PYTHON_VERSION: "3.11"
      PYTHON_ARCH: "64"

init:
  - "ECHO Python %PYTHON_VERSION% (%PYTHON_ARCH%-bit)"

install:
  # Ensure Python is in PATH
  - "SET PATH=%PYTHON%;%PYTHON%\\Scripts;%PATH%"
  
  # Verify Python version
  - "python --version"
  - "pip --version"
  
  # Upgrade pip
  - "python -m pip install --upgrade pip setuptools wheel"
  
  # Install dependencies
  - "pip install PySide6>=6.5.0"
  - "pip install pyperclip>=1.8.2"
  - "pip install openpyxl>=3.1.0"
  - "pip install pyinstaller>=6.0.0"
  - "pip install validators>=0.22.0"

build_script:
  - "SET PATH=%PYTHON%;%PYTHON%\\Scripts;%PATH%"
  - "python -m PyInstaller --name=ShareLinkExtractor --onefile --windowed --noconfirm --clean --hidden-import=PySide6.QtCore --hidden-import=PySide6.QtWidgets --hidden-import=PySide6.QtGui --hidden-import=openpyxl --collect-all=PySide6 run.py"

test: off

artifacts:
  - path: dist\ShareLinkExtractor.exe
    name: ShareLinkExtractor-Windows

deploy:
  provider: GitHub
  auth_token:
    secure: YOUR_ENCRYPTED_TOKEN_HERE
  artifact: ShareLinkExtractor-Windows
  draft: false
  prerelease: false
  on:
    APPVEYOR_REPO_TAG: true
